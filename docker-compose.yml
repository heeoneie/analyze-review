# 홈서버용. 앱과 Cloudflare 터널을 함께 띄운다.
#   docker compose up -d --build
#
# 준비물 (deploy/HOMESERVER.md 참고):
#   .env                              OPENAI_API_KEY, ACCESS_CODE, STORE_NAME
#   cloudflared/config.yml            터널 ingress 설정
#   cloudflared/<터널ID>.json          터널 자격증명 (절대 커밋하지 않는다)

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # 터널이 app 컨테이너를 이름으로 찾는다. localhost 가 아니다.
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      app:
        condition: service_healthy
