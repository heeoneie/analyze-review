# 홈서버용. 앱과 Cloudflare 터널을 함께 띄운다.
#   docker compose up -d --build
#
# 준비물 (deploy/HOMESERVER.md 참고):
#   .env                              OPENAI_API_KEY, ACCESS_CODE, STORE_NAME
#   cloudflared/config.yml            터널 ingress 설정
#   cloudflared/<터널ID>.json          터널 자격증명 (절대 커밋하지 않는다)

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
      # 계정과 답글 이력이 여기 쌓인다. 아래 named volume 위라서
      # `docker compose up --build` 로 이미지를 새로 구워도 남는다.
      #
      # 여기 적은 값이 .env 의 DATABASE_URL 보다 우선한다(compose 규칙).
      # 다른 경로를 쓰려면 .env 가 아니라 이 줄을 고쳐야 한다.
      #
      # 옛 기본 경로는 /app/data/ontology.db 였다. 이 스택에는 그 파일이
      # 존재한 적이 없어서(create_all 이 슬림 이미지에서 한 번도 실행되지
      # 않았다) 옮길 데이터가 없다. 다른 곳에 옛 DB 가 있다면 컨테이너를
      # 세우고 appdata 볼륨의 app.db 자리에 복사한 뒤 기동해야 한다 —
      # alembic 이 baseline 을 건너뛰고 이어받는다.
      DATABASE_URL: "sqlite:////app/var/app.db"
    volumes:
      # 볼륨이 없으면 재배포 때마다 사장님 답글 이력이 통째로 사라진다.
      # 말투 학습의 재료가 영영 안 모인다.
      - appdata:/app/var
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # 터널이 app 컨테이너를 이름으로 찾는다. localhost 가 아니다.
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  appdata:
